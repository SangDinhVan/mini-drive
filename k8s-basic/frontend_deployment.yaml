apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-dev

spec:
  replicas: 3
  selector:
    matchLabels: 
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers: 
        - name: frontend
          image: frontend:lab03
          ports:
            - containerPort: 80