apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-dev

spec:
  replicas: 1
  selector:
    matchLabels: 
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers: 
        - name: backend
          image: backend:lab03
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: backend-secret
            - configMapRef:
                name: backend-config

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          volumeMounts:
            - name: upload-storage
              mountPath: /app/uploads
      
      volumes:
        - name: upload-storage
          persistentVolumeClaim: 
            claimName: upload-svc