name: Integration, Kubernetes, Publish

on:
  workflow_call:

permissions:
  contents: read

jobs:
  integration-and-kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_TAG: ${{ github.sha }}
      COMPOSE_PROJECT_NAME: mini-drive-ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images

      - name: Load the images from the build workflow
        run: |
          docker load --input "$RUNNER_TEMP/images/backend.tar"
          docker load --input "$RUNNER_TEMP/images/frontend.tar"

      - name: Prepare isolated PostgreSQL with TLS and Compose overrides
        run: |
          mkdir -p "$RUNNER_TEMP/mini-drive-ci/tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$RUNNER_TEMP/mini-drive-ci/tls/server.key" \
            -out "$RUNNER_TEMP/mini-drive-ci/tls/server.crt" \
            -subj /CN=postgres
          # Only this throwaway database uses these credentials.
          cat > "$RUNNER_TEMP/mini-drive-ci/backend.env" <<'ENV'
          DATABASE_URL=postgresql://ci:ci@postgres:5432/mini_drive
          UPLOAD_DIR=uploads
          MAX_UPLOAD_MB=10
          ENV
          cat > "$RUNNER_TEMP/mini-drive-ci/compose.yaml" <<'YAML'
          services:
            postgres:
              image: postgres:17-bookworm
              environment:
                POSTGRES_USER: ci
                POSTGRES_PASSWORD: ci
                POSTGRES_DB: mini_drive
              volumes:
                - ${RUNNER_TEMP}/mini-drive-ci/tls:/tls:ro
              entrypoint: ["/bin/sh", "-ec"]
              command:
                - |
                  cp /tls/server.crt /tls/server.key /tmp/
                  chown postgres:postgres /tmp/server.crt /tmp/server.key
                  chmod 600 /tmp/server.key
                  exec docker-entrypoint.sh postgres -c ssl=on \
                    -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U ci -d mini_drive"]
                interval: 2s
                timeout: 5s
                retries: 30
            backend:
              image: mini-drive-backend:${IMAGE_TAG}
              env_file: !override
                - ${RUNNER_TEMP}/mini-drive-ci/backend.env
              depends_on:
                postgres:
                  condition: service_healthy
            frontend:
              image: mini-drive-frontend:${IMAGE_TAG}
          YAML
          echo "COMPOSE_FILE=$GITHUB_WORKSPACE/docker-compose.yaml:$RUNNER_TEMP/mini-drive-ci/compose.yaml" >> "$GITHUB_ENV"

      - name: Prepare the shared HTTP smoke test
        run: |
          cat > "$RUNNER_TEMP/mini-drive-ci/smoke.py" <<'PY'
          import json
          import sys
          from urllib.request import Request, urlopen
          from uuid import uuid4

          base = sys.argv[1]

          def request(path, method="GET", data=None, headers=None):
              req = Request(base + path, data=data, method=method,
                            headers={"Host": "mini-cloud", **(headers or {})})
              with urlopen(req, timeout=15) as response:
                  return response.status, response.read()

          assert b"<html" in request("/")[1].lower()
          assert json.loads(request("/api/health")[1]) == {"status": "ok"}
          filename = f"ci-{uuid4().hex}.txt"
          payload = b"mini-drive CI integration test"
          boundary = uuid4().hex
          body = (
              f"--{boundary}\r\n"
              f'Content-Disposition: form-data; name="file"; filename="{filename}"\r\n'
              "Content-Type: text/plain\r\n\r\n"
          ).encode() + payload + f"\r\n--{boundary}--\r\n".encode()
          status, raw = request("/api/files", "POST", body,
                                {"Content-Type": f"multipart/form-data; boundary={boundary}"})
          assert status == 201, (status, raw)
          item = json.loads(raw)
          try:
              assert item["name"] == filename
              assert item["size_bytes"] == len(payload)
              files = json.loads(request("/api/files")[1])
              assert any(row["id"] == item["id"] for row in files)
              assert request(item["download_url"])[1] == payload
          finally:
              assert request(f"/api/files/{item['id']}", "DELETE")[0] == 204
          files = json.loads(request("/api/files")[1])
          assert all(row["id"] != item["id"] for row in files)
          print(f"PASS {base}: frontend, health, upload, list, download, delete")
          PY

      - name: Integration test through Docker Compose and Nginx
        run: |
          docker compose config --quiet
          docker compose up --detach --no-build --pull missing
          curl --fail --silent --show-error --retry 30 --retry-all-errors \
            --retry-delay 2 --max-time 5 http://127.0.0.1:8088/api/health
          python3 "$RUNNER_TEMP/mini-drive-ci/smoke.py" http://127.0.0.1:8088

      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.17.3

      - name: Install k3d
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64 \
            --output "$RUNNER_TEMP/k3d"
          chmod +x "$RUNNER_TEMP/k3d"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Create cluster and load tested images
        run: |
          k3d cluster create mini-drive-ci --wait --timeout 180s \
            --network mini-drive-ci_default --port "8089:80@loadbalancer"
          k3d image import --cluster mini-drive-ci \
            "mini-drive-backend:$IMAGE_TAG" "mini-drive-frontend:$IMAGE_TAG"

      - name: Prepare test database secret and persistent storage
        run: |
          POSTGRES_CONTAINER=$(docker compose ps --quiet postgres)
          POSTGRES_IP=$(docker inspect --format \
            '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$POSTGRES_CONTAINER")
          kubectl create secret generic backend-secret \
            --from-literal="DATABASE_URL=postgresql://ci:ci@$POSTGRES_IP:5432/mini_drive"
          # The chart expects standard; k3d provides the local-path provisioner.
          kubectl apply -f - <<'YAML'
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: standard
          provisioner: rancher.io/local-path
          reclaimPolicy: Delete
          volumeBindingMode: WaitForFirstConsumer
          YAML

      - name: Deploy with Helm and test through the ingress
        run: |
          helm upgrade --install mini-drive k8s/mini-drive \
            --namespace default --wait --timeout 5m \
            --set backend.image.repository=mini-drive-backend \
            --set-string backend.image.tag="$IMAGE_TAG" \
            --set frontend.image.repository=mini-drive-frontend \
            --set-string frontend.image.tag="$IMAGE_TAG"
          curl --fail --silent --show-error --retry 30 --retry-all-errors \
            --retry-delay 2 --max-time 5 --header 'Host: mini-cloud' \
            http://127.0.0.1:8089/api/health
          python3 "$RUNNER_TEMP/mini-drive-ci/smoke.py" http://127.0.0.1:8089

      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker compose logs --no-color || true
          kubectl get pods,pvc,ingress -o wide || true
          kubectl get events --sort-by=.metadata.creationTimestamp || true
          kubectl logs deployment/backend --all-containers=true --tail=100 || true
          kubectl logs deployment/frontend --all-containers=true --tail=100 || true

      - name: Remove the temporary cluster and Compose volumes
        if: always()
        run: |
          if command -v k3d > /dev/null; then
            k3d cluster delete mini-drive-ci
          fi
          if [ -n "${COMPOSE_FILE:-}" ]; then
            docker compose down --volumes --remove-orphans
          fi

  publish:
    needs: integration-and-kubernetes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish the tested images with commit SHA tags
        run: |
          REPOSITORY="${GITHUB_REPOSITORY,,}"
          for component in backend frontend; do
            docker load --input "$RUNNER_TEMP/images/$component.tar"
            TARGET="ghcr.io/$REPOSITORY/$component:$IMAGE_TAG"
            docker tag "mini-drive-$component:$IMAGE_TAG" "$TARGET"
            docker push "$TARGET"
          done

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
