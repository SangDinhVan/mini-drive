name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    uses: ./.github/workflows/build.yml

  deploy:
    needs: build
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml

  # Require this single check in the main branch ruleset.
  ci-result:
    if: always()
    needs: [test, build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every stage to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          test "$RESULTS" = "success,success,success"
