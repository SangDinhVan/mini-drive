name: Build and Scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docker-images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        component: [backend, frontend]
    env:
      COMPONENT: ${{ matrix.component }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Build image and save it for the next workflow
        run: |
          mkdir -p "$RUNNER_TEMP/images"
          docker build --file "$COMPONENT/dockerfile" \
            --tag "mini-drive-$COMPONENT:$IMAGE_TAG" "$COMPONENT"
          docker save --output "$RUNNER_TEMP/images/$COMPONENT.tar" \
            "mini-drive-$COMPONENT:$IMAGE_TAG"

      - name: Fail on fixable HIGH or CRITICAL vulnerabilities
        run: |
          docker run --rm \
            --volume "$RUNNER_TEMP/images:/images:ro" \
            aquasec/trivy:0.76.1 image \
            --input "/images/$COMPONENT.tar" \
            --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 --timeout 10m

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.component }}
          path: ${{ runner.temp }}/images/${{ matrix.component }}.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
